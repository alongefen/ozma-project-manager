name: בדיקות שלד

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: התקנה, lint, טיפוסים ובנייה
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: סיווג השינוי
        id: scope
        # כשל בסיווג מפעיל את הבדיקות המלאות; ה-check עצמו תמיד נוצר.
        continue-on-error: true
        run: node .github/scripts/change-scope.mjs
      - uses: actions/setup-node@v4
        if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        with:
          node-version: "24"
          cache: npm
      - name: בדיקות סיווג היקף
        if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        run: node --test .github/scripts/change-scope.test.mjs
      - if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        run: npm ci
      - if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        run: npm run lint
      - if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        run: npm run typecheck
      - if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        run: npm run test:foundation
      # בדיקות unit בלבד; בדיקות הענן אינן חלק מה-workflow הזה.
      - if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        run: npm test -- --passWithNoTests
      - if: steps.scope.outcome != 'success' || steps.scope.outputs.docs_only != 'true'
        run: npm run build
